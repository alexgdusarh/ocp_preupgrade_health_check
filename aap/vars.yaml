---
# Settings for aap/configure.yaml, which loads this file automatically.
# Replace every CHANGE-ME before the first run. No secrets here: the AAP host
# and token come from environment variables (see aap/README.md).

# Existing AAP organization that will own the project and job template.
aap_organization: CHANGE-ME-organization

# --- Project: where AAP pulls this repository from ---------------------------
aap_project_name: OCP pre-upgrade health check
aap_scm_url: https://git.example.com/CHANGE-ME/ocp_preupgrade_health_check.git
aap_scm_branch: main
# Path of playbook.yml inside the repository, relative to its root. Keep the
# default when this project is the repository; when it sits in a folder of a
# larger repository, e.g. automation/openshift/playbook.yml. AAP runs from the
# repository root, so the folder's ansible.cfg is ignored - nothing in it is
# needed: filter_plugins/, group_vars/ and templates/ next to playbook.yml are
# found on their own.
aap_playbook: playbook.yml
# Name of an existing Source Control credential for a private repo; "" for none.
aap_scm_credential: ""

# --- Execution environment ----------------------------------------------------
# AAP 2.4's default EE (ee-supported-rhel8) has everything the playbook needs
# (ansible-core 2.16, Jinja2 3.1, kubernetes.core, kubernetes client 29).
aap_execution_environment: Default execution environment

# --- Inventory: the playbook targets the controller-side localhost only -------
aap_inventory_name: OCP pre-upgrade health check - localhost

# --- Job template ---------------------------------------------------------------
aap_job_template_name: OCP pre-upgrade health check

# API URLs offered in the survey's cluster list. Placeholders - replace with
# the real clusters (one entry each).
aap_clusters:
  - https://api.CHANGE-ME-cluster-1.example.com:6443
  - https://api.CHANGE-ME-cluster-2.example.com:6443

aap_upgrade_channels: [eus, stable, fast]
aap_default_upgrade_channel: eus

# Fixed extra vars for every launch (not asked in the survey).
aap_job_extra_vars:
  ocp_auth_method: password
  ocp_validate_certs: true

# --- Survey "Options" and "Advanced settings" ---------------------------------
# configure.yaml builds those two survey questions from these, and passes
# survey_option_flags and survey_advanced_allowlist to the job template as
# extra vars - the health check applies the answers with exactly these
# definitions (tasks/02_survey_options.yml). Edit here, then re-run
# configure.yaml to update both the survey and the job template.

# survey_options (multi-select): each ticked label sets these variables.
survey_option_flags:
  "Skip Portworx checks": {portworx_enabled: false}
  "Skip OpenShift Virtualization checks": {cnv_enabled: false}
  "Skip ODF checks": {odf_enabled: false}
  "Skip CRD finalizer scan (faster)": {finalizer_scan_include_crs: false}
  "Don't fail the job on CRITICAL": {fail_on_critical: false}
  "ACM hub: check hub and managed clusters": {acm_enabled: true}
# Ticked by default in the survey.
survey_option_defaults: ["Skip ODF checks"]

# survey_advanced (text box, `key: value` lines): only these variables, with
# their type (the tasks cast them with | int / | float where used, since a
# set_fact or -e value arrives as text); *_pct values must be between 0 and 1,
# everything else above 0.
# Anything else is rejected, so the box can't change the cluster, the login
# or certificate checks.
survey_advanced_allowlist:
  etcd_quota_bytes: int
  etcd_db_warn_pct: float
  etcd_db_crit_pct: float
  etcd_took_warn_ms: int
  etcd_took_crit_ms: int
  finalizer_scan_stuck_after_seconds: int
  api_report_min_requests: int
  upgrade_path_timeout: int
