---
# Create (or update) the AAP 2.4 objects that run the health check:
# a project for this repository, a localhost inventory, and a job template
# with a survey (cluster, username, password, channel, target version).
# Safe to re-run: each object is matched by name and updated in place.
#
# Settings: aap/vars.yaml, loaded automatically (vars_files below). Replace
# its CHANGE-ME placeholders; the play refuses to run until they are gone. A
# value passed with -e still wins, e.g. -e aap_playbook=folder/playbook.yaml.
# Connection, from environment variables only - never put the token in a file:
#   export CONTROLLER_HOST=https://aap.example.com
#   read -rsp 'AAP token: ' CONTROLLER_OAUTH_TOKEN; echo; export CONTROLLER_OAUTH_TOKEN
#   export CONTROLLER_VERIFY_SSL=true      # the default; keep it on
#   ansible-playbook aap/configure.yaml
#   unset CONTROLLER_OAUTH_TOKEN
# The token needs admin rights on aap_organization (AAP UI: Users > your
# user > Tokens > Add, scope Write). Full directions: aap/README.md.
#
# Modules: ansible.controller (in AAP's ee-supported image) or awx.awx (public
# Galaxy, same modules) - whichever is installed; see `collections:` below.
- name: Configure AAP for the OpenShift pre-upgrade health check
  hosts: localhost
  connection: local
  gather_facts: false
  # Short module names (execution_environment, project, inventory, host,
  # job_template) are looked up
  # in these collections, first one installed wins.
  collections:
    - ansible.controller
    - awx.awx
  # Everything comes from vars.yaml next to this playbook, so the aap/ folder
  # works on its own, from any repository or path.
  vars_files:
    - vars.yaml               # settings, survey definitions (placeholders: CHANGE-ME)

  pre_tasks:
    - name: Stop on unreplaced placeholders
      ansible.builtin.assert:
        that:
          - lookup('env', 'CONTROLLER_HOST') | length > 0
          - lookup('env', 'CONTROLLER_OAUTH_TOKEN') | length > 0
          - _placeholders | length == 0
        fail_msg: >-
          Set CONTROLLER_HOST and CONTROLLER_OAUTH_TOKEN, and replace the CHANGE-ME
          values in aap/vars.yaml{{ (': ' ~ (_placeholders | join(', '))) if _placeholders else '' }}.
        quiet: true
      vars:
        _placeholders: >-
          {{ ({'aap_organization': aap_organization, 'aap_scm_url': aap_scm_url, 'aap_clusters': aap_clusters | join(' ')}
              | combine({'aap_confluence': aap_confluence | to_json} if aap_confluence.enabled | bool else {}))
             | dict2items | selectattr('value', 'search', 'CHANGE-ME') | map(attribute='key') | list }}

  tasks:
    # --- optional: execution environment (aap_ee_push_to / aap_ee_manage) ---
    # podman runs on the machine running this playbook (not inside AAP), with
    # its existing `podman login` sessions for both registries.
    - name: Copy the EE image into your registry (aap_ee_push_to)
      when: aap_ee_push_to | length > 0
      vars:
        _ee_authfile: "{{ aap_ee_authfile | expanduser }}"
        _ee_authfile_path: "{{ _ee_authfile if _ee_authfile is abs else (playbook_dir ~ '/' ~ _ee_authfile) }}"
        _ee_authfile_args: "{{ ['--authfile', _ee_authfile_path] if aap_ee_authfile | length > 0 else [] }}"
      block:
        - name: Check podman is available here
          ansible.builtin.command: podman --version
          changed_when: false

        - name: Check the registry auth file exists (aap_ee_authfile)
          ansible.builtin.stat:
            path: "{{ _ee_authfile_path }}"
          register: _ee_authfile_stat
          when: aap_ee_authfile | length > 0

        - name: Stop if it doesn't
          ansible.builtin.assert:
            that: _ee_authfile_stat.stat.exists
            fail_msg: "aap_ee_authfile {{ _ee_authfile_path }} doesn't exist."
            quiet: true
          when: aap_ee_authfile | length > 0

        - name: Pull {{ aap_ee_image }}
          ansible.builtin.command:
            argv: "{{ ['podman', 'pull'] + _ee_authfile_args + [aap_ee_image] }}"
          changed_when: false

        - name: Tag it as {{ aap_ee_push_to }}
          ansible.builtin.command: podman tag {{ aap_ee_image }} {{ aap_ee_push_to }}
          changed_when: false

        # Red Hat's images are signed, and pushing to another registry means
        # recompressing the layers, which would invalidate that signature -
        # podman refuses ("Would invalidate signatures") unless it's removed.
        # The copy is then unsigned; sign it in your registry if you require it.
        - name: Push {{ aap_ee_push_to }}
          ansible.builtin.command:
            argv: "{{ ['podman', 'push', '--remove-signatures'] + _ee_authfile_args + [aap_ee_push_to] }}"
          register: _ee_push
          changed_when: true

    - name: Execution environment in AAP (aap_ee_manage)
      execution_environment:
        name: "{{ aap_execution_environment }}"
        image: "{{ aap_ee_push_to if aap_ee_push_to | length > 0 else aap_ee_image }}"
        pull: "{{ aap_ee_pull }}"
        credential: "{{ aap_ee_registry_credential if aap_ee_registry_credential | length > 0 else omit }}"
        organization: "{{ aap_organization }}"
        description: "{{ aap_ee_description }}"
        state: present
      when: aap_ee_manage | bool

    - name: Project (pulls this repository)
      project:
        name: "{{ aap_project_name }}"
        organization: "{{ aap_organization }}"
        scm_type: git
        scm_url: "{{ aap_scm_url }}"
        scm_branch: "{{ aap_scm_branch }}"
        scm_credential: "{{ aap_scm_credential if aap_scm_credential | length > 0 else omit }}"
        scm_update_on_launch: true
        default_environment: "{{ aap_execution_environment }}"
        state: present
        wait: true

    - name: Inventory
      inventory:
        name: "{{ aap_inventory_name }}"
        organization: "{{ aap_organization }}"
        description: localhost only - the playbook talks to clusters over their API
        state: present

    # Explicit localhost, so AAP runs the play with the EE's own Python.
    - name: Inventory host localhost
      host:
        name: localhost
        inventory: "{{ aap_inventory_name }}"
        variables:
          ansible_connection: local
          ansible_python_interpreter: !unsafe "{{ ansible_playbook_python }}"
        state: present

    # --- optional: OpenShift login from an existing AAP credential ---
    # aap_ocp_credential is only attached to the job template below. This
    # playbook never creates or changes credentials, so it can't overwrite
    # one: a Machine credential's -u/--ask-pass login is read by
    # action_plugins/ocp_connection_login.py.

    - name: Job template with the launch survey
      job_template:
        name: "{{ aap_job_template_name }}"
        organization: "{{ aap_organization }}"
        job_type: run
        project: "{{ aap_project_name }}"
        playbook: "{{ aap_playbook }}"
        inventory: "{{ aap_inventory_name }}"
        execution_environment: "{{ aap_execution_environment }}"
        # The survey's flag map and allowlist travel with the job template, so the
        # health check applies the answers with the definitions the survey was
        # built from.
        extra_vars: "{{ aap_job_extra_vars | combine({'survey_option_flags': survey_option_flags,
                                                      'survey_advanced_allowlist': survey_advanced_allowlist})
                        | combine({'confluence_enabled': true, 'confluence_url': aap_confluence.url,
                                   'confluence_space_key': aap_confluence.space_key,
                                   'confluence_parent_id': aap_confluence.parent_id | string}
                                  if aap_confluence.enabled | bool else {}) }}"
        survey_enabled: true
        # Survey answers become extra vars. ocp_password (when asked) is a
        # Password field: stored encrypted, shown as $encrypted$ in job details,
        # and the playbook only uses it in one no_log task.
        # With aap_ocp_credential the login comes from that credential, so the
        # survey doesn't ask for username/password.
        # Existing credentials, only attached: the OpenShift login and/or the
        # Confluence token. Omitted when neither is set, so credentials attached
        # by hand in AAP are left alone.
        credentials: "{{ _credentials if _credentials | length > 0 else omit }}"
        survey_spec:
          name: OCP pre-upgrade health check
          description: Cluster, OpenShift login and upgrade target for this run
          spec: "{{ _survey_questions | rejectattr('variable', 'in', _login_questions) | list }}"
        ask_verbosity_on_launch: true
        state: present
      vars:
        _login_questions: "{{ ['ocp_username', 'ocp_password'] if aap_ocp_credential | length > 0 else [] }}"
        _credentials: "{{ [aap_ocp_credential, aap_confluence_credential] | select | list }}"
        _survey_questions:
          - variable: ocp_api_host
            question_name: Cluster
            question_description: API URL of the cluster to check
            type: multiplechoice
            choices: "{{ aap_clusters }}"
            default: "{{ aap_clusters | first }}"
            required: true
          - variable: ocp_username
            question_name: OpenShift username
            question_description: Leave blank to log in as your AAP user
            type: text
            default: ""
            required: false
            min: 0
            max: 255
          - variable: ocp_password
            question_name: OpenShift password
            question_description: Your current (short-lived) OpenShift password
            type: password
            default: ""
            required: true
            min: 1
            max: 1024
          - variable: upgrade_channel
            question_name: Upgrade channel
            question_description: eus targets the next even minor (EUS-to-EUS)
            type: multiplechoice
            choices: "{{ aap_upgrade_channels }}"
            default: "{{ aap_default_upgrade_channel }}"
            required: true
          - variable: upgrade_target_version
            question_name: Target version (optional)
            question_description: Exact x.y.z to check, e.g. 4.20.34; blank uses the channel's latest
            type: text
            default: ""
            required: false
            min: 0
            max: 32
          - variable: survey_options
            question_name: Options
            question_description: Tick to change what this run checks
            type: multiselect
            choices: "{{ survey_option_flags.keys() | list }}"
            default: "{{ survey_option_defaults | join('\n') }}"
            required: false
          - variable: survey_advanced
            question_name: Advanced settings (optional)
            question_description: "One 'name: value' per line, e.g. finalizer_scan_stuck_after_seconds: 1800. Allowed: {{ survey_advanced_allowlist.keys() | join(', ') }}"
            type: textarea
            default: ""
            required: false
            min: 0
            max: 2000
