---
# Runs first so an unsupported toolchain fails here with a clear message,
# instead of later as obscure k8s_exec errors (e.g. "'NoneType' object has
# no attribute 'decode'" when an OS-packaged Ansible 2.10 brings an old
# kubernetes/websocket-client). ansible-core 2.12 is the oldest verified to
# work; 2.16+ is what current kubernetes.core releases officially support.
- name: Require ansible-core >= 2.12
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.12', '>=')
    fail_msg: >-
      This playbook needs ansible-core >= 2.12 (2.16+ recommended), but is running under Ansible
      {{ ansible_version.full }} ({{ ansible_playbook_python }}). Install the requirements into a virtualenv:
      python3 -m venv ~/venv-ocp && source ~/venv-ocp/bin/activate && pip install -r requirements.txt &&
      ansible-galaxy collection install -r requirements.yml (Python 3.10+). See README "Requirements".
    quiet: true

- name: Note when ansible-core is older than kubernetes.core officially supports
  ansible.builtin.debug:
    msg: >-
      ansible-core {{ ansible_version.full }} works but is older than the 2.16 that current kubernetes.core
      releases officially support - upgrade with pip install -r requirements.txt when convenient.
  when: ansible_version.full is version('2.16', '<')

- name: Read the kubernetes and websocket-client versions the k8s modules will use
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -c
      - "import kubernetes, websocket; print(kubernetes.__version__); print(websocket.__version__)"
  register: _py_k8s_libs
  changed_when: false
  failed_when: false

# kubernetes >= 27.2.0 is required: older clients broke every pod exec
# (etcd, ODF/Ceph, opm render) with "'NoneType' object has no attribute
# 'decode'", seen with a distro-packaged Ansible 2.10. websocket-client
# >= 1.6.0 is what requirements.txt installs and what's been tested, but
# Red Hat's own AAP 2.4 EEs have shipped older ones (1.5.1 with kubernetes
# 29.0.0) - a supported pairing, so an older websocket-client only warns.
- name: Require kubernetes >= 27.2.0 (pod exec breaks on older clients)
  ansible.builtin.assert:
    that:
      - _py_k8s_libs.rc == 0
      - _py_k8s_libs.stdout_lines | length > 1
      - _py_k8s_libs.stdout_lines[0] is version('27.2.0', '>=')
    fail_msg: >-
      {{ ansible_playbook_python }} has
      {{ ('kubernetes ' ~ _py_k8s_libs.stdout_lines[0] ~ ', websocket-client ' ~ _py_k8s_libs.stdout_lines[1])
         if (_py_k8s_libs.rc == 0 and _py_k8s_libs.stdout_lines | length > 1)
         else ('no usable kubernetes/websocket-client: ' ~ (_py_k8s_libs.stderr | default('') | trim)) }}
      - need kubernetes >= 27.2.0, or every pod exec (etcd, ODF/Ceph, opm render) fails.
      Run pip install -r requirements.txt in the virtualenv Ansible runs from, or use a current
      execution environment.
    quiet: true

- name: Note an older websocket-client than tested (reported as a WARNING finding below)
  ansible.builtin.debug:
    msg: >-
      websocket-client {{ _py_k8s_libs.stdout_lines[1] }} is older than the 1.6.0 this playbook is tested
      with; pod exec (etcd, ODF/Ceph, opm render) may fail - those sections then show the error.
      Upgrade with pip install -r requirements.txt, or use a current execution environment.
  when: _py_k8s_libs.stdout_lines[1] is version('1.6.0', '<')

- name: Validate auth method and required variables
  ansible.builtin.assert:
    that:
      - ocp_auth_method in ['kubeconfig', 'token', 'password']
      - (ocp_auth_method != 'token') or (ocp_api_host | length > 0 and ocp_api_token | length > 0)
      - (ocp_auth_method != 'password') or (ocp_api_host | length > 0 and ocp_login_username | length > 0 and ocp_password | length > 0)
    fail_msg: >-
      ocp_auth_method={{ ocp_auth_method }} is missing its required variables.
      token needs ocp_api_host + ocp_api_token; password needs ocp_api_host + ocp_username (or an AAP launch) + ocp_password;
      kubeconfig needs ocp_kubeconfig to point at a readable file.
    quiet: true

- name: Log in with ocp_username/ocp_password (password method only)
  ansible.builtin.include_tasks: tasks/01_oauth_login.yml
  when: ocp_auth_method == 'password'

- name: Build raw connection parameters for the selected auth method
  ansible.builtin.set_fact:
    _raw_k8s_conn: "{{ _conn_by_method[ocp_auth_method] }}"
  vars:
    _conn_by_method:
      kubeconfig:
        kubeconfig: "{{ ocp_kubeconfig }}"
        context: "{{ ocp_context }}"
        validate_certs: "{{ ocp_validate_certs }}"
        ca_cert: "{{ ocp_ca_cert }}"
      token:
        host: "{{ ocp_api_host }}"
        api_key: "{{ ocp_api_token }}"
        validate_certs: "{{ ocp_validate_certs }}"
        ca_cert: "{{ ocp_ca_cert }}"
      # The token tasks/01_oauth_login.yml got for ocp_username/ocp_password:
      # the API server doesn't take the password itself.
      password:
        host: "{{ ocp_api_host }}"
        api_key: "{{ ocp_oauth_token | default('') }}"
        validate_certs: "{{ ocp_validate_certs }}"
        ca_cert: "{{ ocp_ca_cert }}"
  no_log: true  # holds the API token

- name: Strip empty connection parameters (so module defaults fall back sanely)
  ansible.builtin.set_fact:
    k8s_conn: "{{ _raw_k8s_conn | dict2items | rejectattr('value', 'equalto', '') | list | items2dict }}"
  no_log: true  # holds the API token

- name: Record report timestamp
  ansible.builtin.set_fact:
    report_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"
    report_generated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

- name: Initialise findings collector
  ansible.builtin.set_fact:
    findings: []

- name: Record an older websocket-client than tested
  ansible.builtin.set_fact:
    findings: "{{ findings + [{'section': 'Prerequisites', 'severity': 'WARNING',
      'summary': 'websocket-client ' ~ _py_k8s_libs.stdout_lines[1] ~ ' (with kubernetes ' ~ _py_k8s_libs.stdout_lines[0]
                 ~ ') is older than the tested 1.6.0 - if pod exec checks (etcd, ODF/Ceph, opm render) show errors,
                 update the execution environment or pip install -r requirements.txt.'}] }}"
  when: _py_k8s_libs.stdout_lines[1] is version('1.6.0', '<')

- name: Apply the AAP survey's options and advanced settings (no-op outside AAP)
  ansible.builtin.include_tasks: tasks/02_survey_options.yml
