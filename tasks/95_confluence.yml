---
# Publish this run to Confluence Cloud: one page per cluster
# (confluence_page_title) under confluence_parent_id (a folder or a page),
# created on the first run and updated on every run after - the page history
# keeps the earlier runs. Body: templates/report.confluence.xhtml.j2 (the
# full report, every section of report.html.j2); the .html and .md reports
# are also attached under stable names (plus catalog_mirror_check.json, the
# olm-upgrade-analyzer input, when task 89b wrote it), so each run adds a new version of the
# same attachment, and the page links to their direct download URLs (which
# need the page ID, hence: create if missing, attach, then write the body).
#
# Auth: Atlassian account email + API token as basic auth; the token from the
# environment variable confluence_api_token_env names (url_password is never
# logged).
# API: v2 for spaces/pages, v1 for attachments (v2 has no upload).
# Transient failures (5xx, 429, no connection: confluence_retry_status) are
# retried confluence_retries times, confluence_retry_delay seconds apart;
# anything else (401, 403, 404, 400) fails at once - waiting won't fix it.
# Best-effort: any failure is reported (rescue) and never fails the run.
- name: Publish the report to Confluence
  block:
    - name: Check the Confluence settings
      ansible.builtin.assert:
        that:
          - confluence_url | length > 0
          - confluence_space_key | length > 0
          - confluence_parent_id | string | length > 0
          - confluence_email | length > 0
          - confluence_api_token | length > 0
        fail_msg: >-
          confluence_enabled is true but a setting is missing: confluence_url, confluence_space_key,
          confluence_parent_id, confluence_email (or CONFLUENCE_EMAIL), and the API token in the
          {{ confluence_api_token_env }} environment variable.
        quiet: true

    - name: Look up the Confluence space {{ confluence_space_key }}
      ansible.builtin.uri:
        url: "{{ _cf_api }}/api/v2/spaces?keys={{ confluence_space_key | urlencode }}"
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        validate_certs: "{{ confluence_validate_certs }}"
        return_content: true
      register: _cf_space
      until: (_cf_space.status | default(-1)) not in confluence_retry_status
      retries: "{{ confluence_retries }}"
      delay: "{{ confluence_retry_delay }}"

    - name: Stop if the space wasn't found
      ansible.builtin.assert:
        that: _cf_space.json.results | default([]) | length > 0
        fail_msg: "Confluence space {{ confluence_space_key }} not found, or this account can't see it."
        quiet: true

    - name: Find this cluster's page ({{ confluence_page_title }})
      ansible.builtin.uri:
        url: "{{ _cf_api }}/api/v2/pages?space-id={{ _cf_space.json.results[0].id }}&title={{ confluence_page_title | urlencode }}&status=current"
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        validate_certs: "{{ confluence_validate_certs }}"
        return_content: true
      register: _cf_found
      until: (_cf_found.status | default(-1)) not in confluence_retry_status
      retries: "{{ confluence_retries }}"
      delay: "{{ confluence_retry_delay }}"

    # Created with a placeholder first so the page ID exists before the body
    # is written: the body links to the attachments' download URLs, which
    # contain it. The full body follows below as version 2.
    - name: Create the page (first run for this cluster)
      ansible.builtin.uri:
        url: "{{ _cf_api }}/api/v2/pages"
        method: POST
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        validate_certs: "{{ confluence_validate_certs }}"
        body_format: json
        body:
          spaceId: "{{ _cf_space.json.results[0].id }}"
          status: current
          title: "{{ confluence_page_title }}"
          parentId: "{{ confluence_parent_id | string }}"
          body:
            representation: storage
            value: "<p>The pre-upgrade health check report is being published.</p>"
        status_code: [200, 201]
        return_content: true
      register: _cf_created
      until: (_cf_created.status | default(-1)) not in confluence_retry_status
      retries: "{{ confluence_retries }}"
      delay: "{{ confluence_retry_delay }}"
      when: _cf_found.json.results | default([]) | length == 0

    - name: Remember the page ID
      ansible.builtin.set_fact:
        confluence_page_id: "{{ (_cf_created.json.id if _cf_created is not skipped else _cf_found.json.results[0].id) | string }}"

    # The JSON is the input for olm-upgrade-analyzer (task 89b); it is
    # missing when that check didn't run, e.g. a --tags subset.
    - name: Attach the reports and the OLM analyzer JSON (stable names, new version each run)
      ansible.builtin.uri:
        url: "{{ _cf_api }}/rest/api/content/{{ confluence_page_id }}/child/attachment"
        method: PUT
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        validate_certs: "{{ confluence_validate_certs }}"
        headers:
          X-Atlassian-Token: no-check
        body_format: form-multipart
        body:
          file:
            filename: "{{ item.name }}"
            content: "{{ lookup('ansible.builtin.file', item.src, rstrip=false) }}"
            mime_type: "{{ item.mime }}"
          minorEdit: "true"
          comment: "{{ report_generated_at }}: {{ overall_status }}"
        status_code: [200]
      register: _cf_attached
      until: (_cf_attached.status | default(-1)) not in confluence_retry_status
      retries: "{{ confluence_retries }}"
      delay: "{{ confluence_retry_delay }}"
      loop: "{{ _cf_attachments | selectattr('src', 'file') | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: confluence_attach_reports | bool

    - name: Remember whether the OLM analyzer JSON was attached
      ansible.builtin.set_fact:
        confluence_olm_json_attached: "{{ confluence_attach_reports | bool and _cf_attachments[2].src is file }}"

    - name: Get the page's current version
      ansible.builtin.uri:
        url: "{{ _cf_api }}/api/v2/pages/{{ confluence_page_id }}"
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        validate_certs: "{{ confluence_validate_certs }}"
        return_content: true
      register: _cf_current
      until: (_cf_current.status | default(-1)) not in confluence_retry_status
      retries: "{{ confluence_retries }}"
      delay: "{{ confluence_retry_delay }}"

    - name: Write the report to the page (new version)
      ansible.builtin.uri:
        url: "{{ _cf_api }}/api/v2/pages/{{ confluence_page_id }}"
        method: PUT
        url_username: "{{ confluence_email }}"
        url_password: "{{ confluence_api_token }}"
        force_basic_auth: true
        validate_certs: "{{ confluence_validate_certs }}"
        body_format: json
        # One expression, so version.number stays a number (a YAML scalar
        # would be sent as the string "2").
        body: "{{ {'id': confluence_page_id, 'status': 'current', 'title': confluence_page_title,
                   'body': {'representation': 'storage', 'value': _cf_body},
                   'version': {'number': (_cf_current.json.version.number | int) + 1,
                               'message': report_generated_at ~ ': ' ~ overall_status}} }}"
        return_content: true
      register: _cf_updated
      until: (_cf_updated.status | default(-1)) not in confluence_retry_status
      retries: "{{ confluence_retries }}"
      delay: "{{ confluence_retry_delay }}"

    - name: Remember the page link
      ansible.builtin.set_fact:
        confluence_page_url: "{{ confluence_url | regex_replace('/+$', '') }}/wiki{{ _cf_page._links.webui | default('/pages/viewpage.action?pageId=' ~ _cf_page.id) }}"

    - name: Report the Confluence page
      ansible.builtin.debug:
        msg: "Published to Confluence: {{ confluence_page_url }}"

  rescue:
    - name: Report that publishing to Confluence failed (the health check itself is unaffected)
      ansible.builtin.debug:
        msg: >-
          Publishing to Confluence FAILED at "{{ ansible_failed_task.name | default('?') }}":
          {{ (ansible_failed_result.msg | default('')) ~ ' ' ~ (ansible_failed_result.json.message | default(ansible_failed_result.json.errors | default('') | string)) }}

  vars:
    _cf_api: "{{ confluence_url | regex_replace('/+$', '') }}/wiki"
    _cf_body: "{{ lookup('ansible.builtin.template', 'report.confluence.xhtml.j2') }}"
    _cf_page: "{{ _cf_updated.json | default({}) }}"
    confluence_attachment_basename: "{{ cluster_folder }}-preupgrade-report"
    confluence_olm_json_name: "{{ cluster_folder }}-catalog_mirror_check.json"
    _cf_attachments:
      - {src: "{{ report_output_dir }}/{{ report_basename }}.html", name: "{{ confluence_attachment_basename }}.html", mime: text/html}
      - {src: "{{ report_output_dir }}/{{ report_basename }}.md", name: "{{ confluence_attachment_basename }}.md", mime: text/markdown}
      - {src: "{{ catalog_render_output_dir }}/catalog_mirror_check.json", name: "{{ confluence_olm_json_name }}", mime: application/json}
